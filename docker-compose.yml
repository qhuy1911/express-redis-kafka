services:
  postgres:
    image: postgres:17
    container_name: event-driven-ecommerce-postgres
    restart: unless-stopped

    environment:
      POSTGRES_DB: gemini_ecommerce
      POSTGRES_USER: ecommerce
      POSTGRES_PASSWORD: ecommerce

    ports:
      - '5432:5432'

    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: event-driven-ecommerce-redis
    restart: unless-stopped
    ports:
      - '6379:6379'
    volumes:
      - redis_data:/data

volumes:
  postgres_data:
  redis_data:
